<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 / 회원가입 · Paper Radar</title>
<style>
  :root {
    --bg: #0a0f13;
    --bg-elev: #0e1418;
    --bg-card: #111a20;
    --bg-card-2: #0c141a;
    --border: #1b2630;
    --border-soft: #152028;
    --text: #e6f1ef;
    --text-dim: #8aa0a8;
    --text-mute: #5a6b73;
    --accent: #3fe0b0;
    --ai: #3fe0b0;
    --dt: #f4a25c;
    --iot: #b48cff;
    --danger: #ff6b6b;
    --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
    font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .page { width: 100%; max-width: 460px; padding: 20px; }

  /* Brand */
  .brand {
    display: flex; align-items: center; gap: 12px;
    justify-content: center; margin-bottom: 36px;
  }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, #153a33, #0e1f1b);
    display: grid; place-items: center; color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(63,224,176,0.25);
    font-size: 18px;
  }
  .brand .title { font-weight: 700; font-size: 18px; }
  .brand .sub {
    color: var(--text-mute); font-size: 10px;
    letter-spacing: 1.4px; text-transform: uppercase;
  }

  /* Card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  /* Tabs */
  .tabs {
    display: flex; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .tabs .tab {
    flex: 1; text-align: center; padding: 10px;
    font-size: 13.5px; font-weight: 600;
    color: var(--text-mute); cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tabs .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .tab:hover { color: var(--text-dim); }

  /* Messages */
  .msg {
    text-align: center; padding: 10px; border-radius: 8px;
    margin-bottom: 16px; font-size: 12.5px; display: none;
  }
  .msg.ok  { display: block; background: rgba(63,224,176,0.1);
    color: var(--accent); border: 1px solid rgba(63,224,176,0.3); }
  .msg.err { display: block; background: rgba(255,107,107,0.1);
    color: var(--danger); border: 1px solid rgba(255,107,107,0.3); }

  /* Forms */
  .panel { display: none; }
  .panel.active { display: block; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 11.5px; color: var(--text-dim);
    margin-bottom: 6px; font-weight: 500;
  }
  .field label .req { color: var(--accent); margin-left: 2px; }
  .field input, .field select {
    width: 100%; background: var(--bg-card-2);
    border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(63,224,176,0.1);
  }
  .field input::placeholder { color: var(--text-mute); }
  .field select { cursor: pointer; }
  .field select option { background: var(--bg-card); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .pw-hint { font-size: 10.5px; color: var(--text-mute); margin-top: 4px; }

  /* Submit */
  .submit-btn {
    width: 100%; background: var(--accent); color: #0a0f13;
    border: none; border-radius: 10px; padding: 12px;
    font-size: 14px; font-weight: 700; margin-top: 8px;
    box-shadow: 0 0 24px rgba(63,224,176,0.2);
    transition: background .15s;
  }
  .submit-btn:hover { background: #52eabd; }

  /* Divider + link */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0; color: var(--text-mute); font-size: 11px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }
  .bottom-link {
    text-align: center; font-size: 12.5px; color: var(--text-dim);
  }
  .bottom-link a {
    color: var(--accent); font-weight: 500;
    border-bottom: 1px solid rgba(63,224,176,0.3); padding-bottom: 1px;
  }
  .bottom-link a:hover { border-color: var(--accent); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1d2a32; border-radius: 10px; }
</style>
</head>
<body>

<div class="page">
  <div class="brand">
    <div class="logo">▦</div>
    <div>
      <div class="title">Paper Radar</div>
      <div class="sub">BIST Research Lab</div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-tab="login">로그인</div>
      <div class="tab" data-tab="register">회원가입</div>
    </div>

    <div class="msg" id="msg"></div>

    <!-- ===== 로그인 ===== -->
    <div class="panel active" id="panelLogin">
      <div class="field">
        <label>이름 <span class="req">*</span></label>
        <input id="loginName" placeholder="홍길동" />
      </div>
      <div class="field">
        <label>비밀번호 <span class="req">*</span></label>
        <input id="loginPw" type="password" placeholder="비밀번호" />
      </div>
      <button class="submit-btn" id="btnLogin">로그인</button>
    </div>

    <!-- ===== 회원가입 ===== -->
    <div class="panel" id="panelRegister">
      <div class="field">
        <label>이름 <span class="req">*</span></label>
        <input id="regName" placeholder="홍길동" />
      </div>
      <div class="field">
        <label>이메일 <span class="req">*</span></label>
        <input id="regEmail" type="email" placeholder="name@skku.edu" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>비밀번호 <span class="req">*</span></label>
          <input id="regPw" type="password" placeholder="4자리 이상" />
        </div>
        <div class="field">
          <label>비밀번호 확인 <span class="req">*</span></label>
          <input id="regPw2" type="password" placeholder="다시 입력" />
        </div>
      </div>
      <div class="pw-hint">비밀번호는 4자리 이상이면 됩니다.</div>

      <button class="submit-btn" id="btnRegister">가입하기</button>
    </div>

    <div class="divider">또는</div>
    <div class="bottom-link">
      <a href="/home">← Paper Radar 홈으로 돌아가기</a>
    </div>
  </div>
</div>

<script>
  const msgEl = document.getElementById('msg');
  function showMsg(text, ok) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
  }
  function hideMsg() { msgEl.className = 'msg'; }

  // Tab switching
  document.querySelectorAll('.tabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const which = tab.getAttribute('data-tab');
      document.getElementById('panelLogin').classList.toggle('active', which === 'login');
      document.getElementById('panelRegister').classList.toggle('active', which === 'register');
      hideMsg();
    });
  });

  // Show register tab if navigated from signup button
  if (location.hash === '#register' || new URLSearchParams(location.search).get('tab') === 'register') {
    document.querySelector('.tab[data-tab="register"]').click();
  }

  // ===== Login =====
  document.getElementById('btnLogin').addEventListener('click', async () => {
    const name = document.getElementById('loginName').value.trim();
    const pw = document.getElementById('loginPw').value;
    if (!name || !pw) return showMsg('이름과 비밀번호를 입력하세요.', false);

    try {
      const resp = await fetch('/api/lr/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, password: pw }),
      });
      const data = await resp.json();

      if (data.success) {
        localStorage.setItem('lr_user', name);
        showMsg('로그인 성공! 홈으로 이동합니다.', true);
        setTimeout(() => { window.location.href = '/home'; }, 600);
      } else {
        showMsg(data.error || '로그인 실패', false);
      }
    } catch (e) {
      showMsg('서버 연결 오류', false);
    }
  });

  document.getElementById('loginPw').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnLogin').click();
  });

  // ===== Register =====
  document.getElementById('btnRegister').addEventListener('click', async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pw = document.getElementById('regPw').value;
    const pw2 = document.getElementById('regPw2').value;

    if (!name || !email) return showMsg('이름과 이메일은 필수입니다.', false);
    if (pw.length < 4) return showMsg('비밀번호는 4자리 이상이어야 합니다.', false);
    if (pw !== pw2) return showMsg('비밀번호가 일치하지 않습니다.', false);

    try {
      const resp = await fetch('/api/lr/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password: pw }),
      });
      const data = await resp.json();

      if (data.success) {
        localStorage.setItem('lr_user', name);
        showMsg('가입 완료! 홈으로 이동합니다.', true);
        setTimeout(() => { window.location.href = '/home'; }, 800);
      } else {
        showMsg(data.error || '회원가입 실패', false);
      }
    } catch (e) {
      showMsg('서버 연결 오류', false);
    }
  });

  document.getElementById('regPw2').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnRegister').click();
  });
</script>
</body>
</html>
