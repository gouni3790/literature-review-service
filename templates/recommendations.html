<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Literature Review · 추천 논문</title>
<style>
  :root {
    --bg: #0a0f13; --bg-card: #111a20; --bg-card-2: #0c141a;
    --border: #1b2630; --border-soft: #152028;
    --text: #e6f1ef; --text-dim: #8aa0a8; --text-mute: #5a6b73;
    --accent: #3fe0b0; --accent-soft: #1c3c36;
    --core: #ff6b6b; --related: #f4a25c; --reference: #b48cff;
    --shadow: 0 0 0 1px rgba(63,224,176,0.08), 0 8px 30px rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 30px 20px; background: var(--bg); color: var(--text);
         font-family: "Pretendard","Inter",-apple-system,"Apple SD Gothic Neo",sans-serif; }
  .container { max-width: 1280px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px; padding: 0 4px; }
  .topbar a { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  .topbar a:hover { color: var(--accent); }

  .card { background: var(--bg-card); border: 1px solid var(--border);
          border-radius: 14px; padding: 18px 22px; margin-bottom: 14px; box-shadow: var(--shadow); }

  .profile-head { display: grid; grid-template-columns: 80px 1fr auto; gap: 18px; align-items: center; }
  .avatar { width: 80px; height: 80px; border-radius: 14px;
            background: var(--accent-soft); border: 1px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 700; color: var(--accent); }
  .name-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .name { font-size: 26px; font-weight: 700; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 11px;
          background: var(--bg-card-2); border: 1px solid var(--border);
          color: var(--text-dim); letter-spacing: 0.4px; }
  .pill.type-A { color: #3fe0b0; border-color: #3fe0b0; }
  .pill.type-B { color: #f4a25c; border-color: #f4a25c; }
  .pill.type-C { color: #b48cff; border-color: #b48cff; }
  .meta { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .meta b { color: var(--text); font-weight: 600; }
  .keywords { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .kw-chip { padding: 3px 10px; border: 1px solid var(--border);
             border-radius: 999px; font-size: 12px; color: var(--text-dim);
             background: var(--bg-card-2); }
  .kw-chip .freq { color: var(--accent); margin-left: 4px; font-weight: 600; }
  .stats { display: flex; gap: 22px; align-items: center; }
  .stat { text-align: right; }
  .stat-label { font-size: 11px; color: var(--text-mute); letter-spacing: 1px; text-transform: uppercase; }
  .stat-value { font-size: 24px; font-weight: 700; color: var(--text); }

  .digest-info { padding: 14px 18px; background: var(--bg-card); border-radius: 10px;
                 border: 1px solid var(--border-soft); margin-bottom: 14px;
                 display: flex; justify-content: space-between; align-items: center; }
  .digest-info .live::before { content: "● "; color: var(--accent); }

  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 14px; }
  .h3 { font-size: 14px; font-weight: 600; color: var(--text-dim); margin: 0 0 10px;
        letter-spacing: 1px; text-transform: uppercase; }
  .topic-item { padding: 10px 12px; background: var(--bg-card-2); border-radius: 8px;
                margin-bottom: 8px; border: 1px solid var(--border-soft); }
  .topic-name { font-size: 13px; color: var(--text); font-weight: 600; margin-bottom: 4px; }
  .topic-keywords { font-size: 11px; color: var(--text-dim); }
  .journal-item { padding: 8px 12px; font-size: 13px; color: var(--text-dim);
                  background: var(--bg-card-2); border-radius: 6px; margin-bottom: 6px;
                  display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .source-badge { font-size: 10px; padding: 2px 8px; border-radius: 999px;
                  background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; background: var(--bg-card-2); border: 1px solid var(--border-soft);
         border-radius: 999px; font-size: 13px; color: var(--text-dim); cursor: pointer; user-select:none; }
  .tab.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .tab .count { margin-left: 6px; opacity: 0.7; }

  .rec-card { padding: 16px; border: 1px solid var(--border-soft); border-radius: 10px;
              background: var(--bg-card-2); margin-bottom: 10px; }
  .rec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .rec-grade { padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
               letter-spacing: 1px; text-transform: uppercase; }
  .grade-core { background: rgba(255,107,107,0.12); color: var(--core); border: 1px solid var(--core); }
  .grade-related { background: rgba(244,162,92,0.12); color: var(--related); border: 1px solid var(--related); }
  .grade-reference { background: rgba(180,140,255,0.12); color: var(--reference); border: 1px solid var(--reference); }
  .rec-similarity { width: 50px; height: 50px; border-radius: 50%;
                    border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center;
                    font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .rec-title { font-size: 15px; font-weight: 600; margin: 8px 0 4px; line-height: 1.4; }
  .rec-title a { color: var(--text); text-decoration: none; }
  .rec-title a:hover { color: var(--accent); }
  .rec-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .rec-summary { font-size: 13px; color: var(--text-dim); line-height: 1.55;
                 padding: 10px 12px; background: var(--bg); border-radius: 6px;
                 border-left: 3px solid var(--accent); margin-top: 8px; }
  .rec-summary strong { color: var(--text); }
  .rec-summary > div { margin-bottom: 4px; }
  .rec-reason { font-size: 12px; color: var(--accent); margin-top: 8px; font-style: italic; line-height: 1.5; }
  .rec-actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn { padding: 5px 12px; background: transparent; border: 1px solid var(--border);
         border-radius: 6px; color: var(--text-dim); font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .loading { padding: 40px; text-align: center; color: var(--text-mute); }
  .empty { padding: 40px; text-align: center; color: var(--text-mute); font-size: 14px; }
  .error { padding: 16px; background: rgba(255,107,107,0.1); border: 1px solid var(--core);
           border-radius: 8px; color: var(--core); margin-bottom: 14px; }

  .researcher-picker {
    background: var(--bg-card-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 6px;
    font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <a href="/litreview">◀ 메인 대시보드로</a>
    <div style="display:flex; gap:12px; align-items:center;">
      <span class="meta">연구원 선택:</span>
      <select id="researcherPicker" class="researcher-picker"></select>
    </div>
  </div>

  <div id="errorBox"></div>

  <div class="card profile-head" id="profileHead">
    <div class="loading" style="grid-column: 1 / -1;">로딩 중...</div>
  </div>

  <div class="digest-info" id="digestInfo" style="display:none;">
    <div>
      <div class="meta"><span class="live">DAILY DIGEST</span></div>
      <div style="font-size:16px; font-weight:600; margin-top:4px;" id="digestSummary"></div>
    </div>
    <div>
      <span class="meta">매일 <b style="color:var(--accent)">10:00</b> 발송</span>
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="card" id="topicsCard" style="display:none;">
        <h3 class="h3">연구 주제 <span id="topicsCount"></span></h3>
        <div id="topicsList"></div>
      </div>
      <div class="card" id="journalsCard" style="display:none;">
        <h3 class="h3">모니터링 저널 <span id="journalsCount"></span></h3>
        <div id="journalsList"></div>
      </div>
    </div>
    <div>
      <div class="card" id="usefulTrackCard" style="display:none; margin-bottom:16px;">
        <h3 class="h3">📌 당신의 👍 피드백 기반 추천</h3>
        <div id="usefulTrackList"></div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="recList">
        <div class="loading">추천 논문 로딩 중...</div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  let RID = parseInt(params.get('id') || '1', 10);

  let allRecs = [];
  let activeFilter = 'all';

  function gradePriority(g) { return ({core:0, related:1, reference:2})[g] ?? 99; }

  function dedup(recs) {
    const map = new Map();
    for (const r of recs) {
      const ex = map.get(r.paper_id);
      if (!ex) { map.set(r.paper_id, r); continue; }
      if (gradePriority(r.grade) < gradePriority(ex.grade)) map.set(r.paper_id, r);
      else if (r.grade === ex.grade && (r.similarity_score||0) > (ex.similarity_score||0)) map.set(r.paper_id, r);
    }
    return [...map.values()].sort((a,b) => (b.similarity_score||0) - (a.similarity_score||0));
  }

  function showError(msg) {
    document.getElementById('errorBox').innerHTML = '<div class="error">⚠ ' + msg + '</div>';
  }

  async function fetchJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + ' → ' + r.status);
    return r.json();
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const ms = Date.now() - new Date(dateStr).getTime();
    const days = Math.floor(ms / 86400000);
    if (days < 1) return '오늘';
    if (days < 30) return days + '일 전';
    const months = Math.floor(days / 30);
    if (months < 12) return months + '개월 전';
    return Math.floor(months / 12) + '년 전';
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  async function renderResearcherPicker() {
    try {
      const list = await fetchJSON('/litreview/api/researchers');
      const sel = document.getElementById('researcherPicker');
      sel.innerHTML = list.map(r =>
        `<option value="${r.id}" ${r.id === RID ? 'selected' : ''}>${escapeHtml(r.name)}</option>`
      ).join('');
      sel.addEventListener('change', () => {
        const newId = parseInt(sel.value, 10);
        if (newId !== RID) {
          window.location.href = '/litreview/recommendations?id=' + newId;
        }
      });
    } catch (e) {
      console.warn('researcher picker:', e);
    }
  }

  async function renderHeader() {
    try {
      const r = await fetchJSON(`/litreview/api/researchers/${RID}`);
      const profile = await fetchJSON(`/litreview/api/researchers/${RID}/profile`);

      document.title = `${r.name} · 추천 논문`;

      const initial = (r.name || '?').charAt(0);
      const recCount = r.recommendation_count ?? 0;
      const savedCount = r.saved_count ?? 0;
      const updatedAt = r.updated_at ? timeAgo(r.updated_at) : '';

      const kws = (profile.keyword_frequency || []).slice(0, 8);
      const kwHtml = kws.map(k =>
        `<span class="kw-chip">${escapeHtml(k.keyword)}<span class="freq">×${k.count}</span></span>`
      ).join('');

      const typePill = `<span class="pill type-${r.researcher_type||'C'}">${r.researcher_type||'C'} 유형</span>`;
      const groupPill = r.group ? `<span class="pill">${escapeHtml(r.group)}</span>` : '';

      document.getElementById('profileHead').innerHTML = `
        <div class="avatar">${escapeHtml(initial)}</div>
        <div>
          <div class="name-row">
            <div class="name">${escapeHtml(r.name)}</div>
            ${typePill}
            ${groupPill}
          </div>
          <div class="meta">
            ${r.scopus_id ? `Scopus ID: <b>${escapeHtml(r.scopus_id)}</b>  ·  ` : ''}
            이메일: <b>${escapeHtml(r.email)}</b>
            ${updatedAt ? `  ·  최근 업데이트 <b>${updatedAt}</b>` : ''}
          </div>
          <div class="keywords">${kwHtml || '<span class="meta">키워드 없음</span>'}</div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-label">논문</div><div class="stat-value">${r.paper_count || 0}</div></div>
          <div class="stat"><div class="stat-label">추천</div><div class="stat-value">${recCount}</div></div>
          <div class="stat"><div class="stat-label">저장</div><div class="stat-value">${savedCount}</div></div>
        </div>
      `;

      const topics = profile.topics || [];
      if (topics.length > 0) {
        document.getElementById('topicsCard').style.display = 'block';
        document.getElementById('topicsCount').textContent = `(${topics.length})`;
        document.getElementById('topicsList').innerHTML = topics.map(t => `
          <div class="topic-item">
            <div class="topic-name">${escapeHtml(t.name)}</div>
            <div class="topic-keywords">${(t.keywords||[]).slice(0,6).map(escapeHtml).join(', ') || '키워드 없음'}</div>
          </div>
        `).join('');
      }
    } catch (e) {
      showError('연구원 정보를 불러오지 못했습니다: ' + e.message);
    }
  }

  async function renderJournals() {
    try {
      const journals = await fetchJSON(`/litreview/api/researchers/${RID}/journals/target`);
      if (!Array.isArray(journals) || journals.length === 0) return;

      document.getElementById('journalsCard').style.display = 'block';
      document.getElementById('journalsCount').textContent = `(${journals.length})`;
      document.getElementById('journalsList').innerHTML = journals.slice(0, 15).map(j => {
        const labels = { reference:'Reference', user:'User', discovery:'Discovery', feedback:'Feedback', admin:'Admin' };
        const label = labels[j.source_type] || j.source_type || '';
        return `
          <div class="journal-item">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(j.journal_name)}</span>
            ${label ? `<span class="source-badge">${escapeHtml(label)}</span>` : ''}
          </div>
        `;
      }).join('');
    } catch (e) {}
  }

  function renderRec(rec) {
    const grade = rec.grade || 'reference';
    const score = rec.similarity_score != null ? Math.round(rec.similarity_score * 100) : '–';
    const doi = rec.doi ? `https://doi.org/${rec.doi}` : '#';

    let summaryHtml = '';
    if (grade === 'core' && rec.summary_core_topic) {
      summaryHtml = `
        <div class="rec-summary">
          <div><strong>핵심 주제:</strong> ${escapeHtml(rec.summary_core_topic)}</div>
          ${rec.summary_method ? `<div><strong>방법:</strong> ${escapeHtml(rec.summary_method)}</div>` : ''}
          ${rec.summary_results ? `<div><strong>결과:</strong> ${escapeHtml(rec.summary_results)}</div>` : ''}
        </div>
      `;
    }

    let reasonHtml = '';
    if (grade === 'core' && rec.recommendation_reason) {
      reasonHtml = `<div class="rec-reason">✦ ${escapeHtml(rec.recommendation_reason)}</div>`;
    }

    const savedClass = rec.is_saved ? ' active' : '';
    const useful = rec.user_feedback === 'useful' ? ' active' : '';
    const irrelevant = rec.user_feedback === 'not_relevant' ? ' active' : '';

    return `
      <div class="rec-card" data-rec-id="${rec.id}">
        <div class="rec-head">
          <div style="flex:1; min-width:0;">
            <span class="rec-grade grade-${grade}">${grade}</span>
            <div class="rec-title">
              <a href="${doi}" target="_blank" rel="noopener">${escapeHtml(rec.title || '제목 없음')}</a>
            </div>
            <div class="rec-meta">
              ${rec.journal ? '<em>'+escapeHtml(rec.journal)+'</em>' : ''}
              ${rec.year ? ' &middot; ' + rec.year : ''}
              ${rec.topic_name ? ' &middot; ' + escapeHtml(rec.topic_name) : ''}
              ${rec.created_at ? ' &middot; ' + timeAgo(rec.created_at) : ''}
            </div>
          </div>
          <div class="rec-similarity">${score}</div>
        </div>
        ${summaryHtml}
        ${reasonHtml}
        <div class="rec-actions">
          <button class="btn${useful}" data-action="useful">👍 유용해요</button>
          <button class="btn${irrelevant}" data-action="not_relevant">👎 관련없음</button>
          <button class="btn${savedClass}" data-action="save">📌 ${rec.is_saved ? '저장됨' : '저장'}</button>
        </div>
      </div>
    `;
  }

  function renderTabs() {
    const counts = {
      all: allRecs.length,
      core: allRecs.filter(r => r.grade === 'core').length,
      related: allRecs.filter(r => r.grade === 'related').length,
      reference: allRecs.filter(r => r.grade === 'reference').length,
      saved: allRecs.filter(r => r.is_saved).length,
      unread: allRecs.filter(r => !r.is_read).length,
    };
    const tabs = [['all','전체'],['core','Core'],['related','Related'],['reference','Reference'],['saved','저장'],['unread','안 읽음']];
    document.getElementById('tabs').innerHTML = tabs.map(([k,label]) => `
      <div class="tab ${activeFilter === k ? 'active' : ''}" data-filter="${k}">
        ${label}<span class="count">${counts[k]}</span>
      </div>
    `).join('');
  }

  function renderRecList() {
    let recs = allRecs;
    if (activeFilter === 'core') recs = recs.filter(r => r.grade === 'core');
    else if (activeFilter === 'related') recs = recs.filter(r => r.grade === 'related');
    else if (activeFilter === 'reference') recs = recs.filter(r => r.grade === 'reference');
    else if (activeFilter === 'saved') recs = recs.filter(r => r.is_saved);
    else if (activeFilter === 'unread') recs = recs.filter(r => !r.is_read);

    const list = document.getElementById('recList');
    if (recs.length === 0) {
      list.innerHTML = '<div class="empty">표시할 추천이 없습니다.</div>';
      return;
    }
    list.innerHTML = recs.slice(0, 100).map(renderRec).join('');
  }

  async function renderUsefulTrack() {
    try {
      const groups = await fetchJSON(`/litreview/api/researchers/${RID}/useful-recommendations`);
      // 빈 결과(추천 0편) 그룹은 숨김
      const nonEmpty = (groups || []).filter(g => (g.recommendations || []).length > 0);
      if (nonEmpty.length === 0) return;

      const html = nonEmpty.map(g => {
        const u = g.useful_paper;
        const recs = g.recommendations;
        const recsHtml = recs.slice(0, 10).map(r => {
          const score = Math.round((r.score || 0) * 100);
          const doi = r.doi ? `https://doi.org/${r.doi}` : '#';
          return `
            <div class="rec-card" style="margin-top:8px;">
              <div class="rec-head">
                <div style="flex:1; min-width:0;">
                  <div class="rec-title">
                    <a href="${doi}" target="_blank" rel="noopener">${escapeHtml(r.title || '제목 없음')}</a>
                  </div>
                  <div class="rec-meta">
                    ${r.journal ? '<em>'+escapeHtml(r.journal)+'</em>' : ''}
                    ${r.year ? ' &middot; ' + r.year : ''}
                  </div>
                </div>
                <div class="rec-similarity">${score}</div>
              </div>
            </div>
          `;
        }).join('');
        const more = recs.length > 10 ? `<div class="meta" style="margin-top:6px;">… 외 ${recs.length - 10}편</div>` : '';
        return `
          <div style="border-top:1px solid var(--border, #eee); padding-top:12px; margin-top:12px;">
            <div style="font-weight:600;">"${escapeHtml((u.title || '').slice(0, 80))}"</div>
            <div class="meta" style="margin-top:2px;">
              ${u.journal ? escapeHtml(u.journal) : ''}${u.year ? ' · ' + u.year : ''}
              · 👍 ${u.created_at ? timeAgo(u.created_at) : ''}
              · 관련 ${recs.length}편
            </div>
            ${recsHtml}
            ${more}
          </div>
        `;
      }).join('');

      document.getElementById('usefulTrackList').innerHTML = html;
      document.getElementById('usefulTrackCard').style.display = 'block';
    } catch (e) {
      console.warn('useful track:', e);
    }
  }

  async function renderRecommendations() {
    try {
      const recs = await fetchJSON(`/litreview/api/researchers/${RID}/recommendations`);
      allRecs = dedup(recs);

      const counts = {
        core: allRecs.filter(r => r.grade === 'core').length,
        related: allRecs.filter(r => r.grade === 'related').length,
        reference: allRecs.filter(r => r.grade === 'reference').length,
      };
      document.getElementById('digestSummary').textContent =
        `Core ${counts.core} · Related ${counts.related} · Reference ${counts.reference}`;
      document.getElementById('digestInfo').style.display = 'flex';

      renderTabs();
      renderRecList();
    } catch (e) {
      document.getElementById('recList').innerHTML =
        '<div class="error">추천 데이터를 불러오지 못했습니다: ' + escapeHtml(e.message) + '</div>';
    }
  }

  document.addEventListener('click', async (e) => {
    const tab = e.target.closest('.tab');
    if (tab) {
      activeFilter = tab.dataset.filter;
      renderTabs();
      renderRecList();
      return;
    }

    const btn = e.target.closest('.btn[data-action]');
    if (btn) {
      const card = btn.closest('.rec-card');
      const recId = parseInt(card.dataset.recId, 10);
      const action = btn.dataset.action;
      const rec = allRecs.find(r => r.id === recId);
      if (!rec) return;

      try {
        if (action === 'save') {
          const resp = await fetch(`/litreview/api/recommendations/${recId}/save`, { method: 'POST' });
          const d = await resp.json();
          rec.is_saved = d.saved !== undefined ? d.saved : !rec.is_saved;
        } else {
          await fetch(`/litreview/api/recommendations/${recId}/feedback`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ feedback: action })
          });
          rec.user_feedback = rec.user_feedback === action ? null : action;
        }
        renderRecList();
        renderTabs();
      } catch (e) {
        showError('동작 실패: ' + e.message);
      }
    }
  });

  (async () => {
    await renderResearcherPicker();
    await renderHeader();
    await renderJournals();
    await renderUsefulTrack();
    await renderRecommendations();
  })();
})();
</script>
</body>
</html>
